<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkingSites sign-in preview</title>
<!-- base.css stands in for the PatternFly CSS authentik already ships. Preview only, never paste it. -->
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="talkingsites.css">
<link rel="stylesheet" id="variant" href="variants/glass.css">
<link rel="stylesheet" id="logo" href="logo/band.css">
<style>
  .pf-c-background-image {
    background: #3A2F9E url("https://cloud.electronworkshop.com.au/s/9J7eTj4DcBWynTP/download") center / cover no-repeat;
  }
  .page[hidden] { display: none; }
  .switcher {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: 20px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px;
    max-width: calc(100vw - 32px); border-radius: 999px;
    background: rgba(16, 14, 40, .8); backdrop-filter: blur(10px);
    font: 600 13px/1 'Glory', ui-sans-serif, system-ui, sans-serif;
  }
  .switcher button {
    color: #E7E4F8; background: none; border: 0; cursor: pointer;
    padding: 8px 15px; border-radius: 999px; font: inherit;
  }
  .switcher [aria-pressed="true"] { background: #FFFFFF; color: #14112B; }
  .logo-pick { display: flex; align-items: center; gap: 6px; color: #E7E4F8; padding: 0 6px 0 10px; }
  .logo-pick select {
    font: inherit; color: #14112B; background: #FFFFFF; border: 0; border-radius: 999px; padding: 6px 10px; cursor: pointer;
  }
  .switcher .sep { width: 1px; background: rgba(255, 255, 255, .2); margin: 4px 2px; }
</style>
</head>
<body>
<div class="pf-c-background-image"></div>
<div class="pf-c-login">
  <div class="pf-c-login__container">

    <!-- Sign in: the ts-authentication flow -->
    <div class="pf-c-login__main page" data-page="signin">
      <div class="pf-c-login__main-header pf-c-brand ak-brand"><img src="https://cloud.electronworkshop.com.au/s/5bW7TXe2JH4KgBE/download" alt="TalkingSites"></div>
      <header class="pf-c-login__main-header">
        <h1 class="pf-c-title pf-m-3xl">Sign in</h1>
      </header>
      <div class="pf-c-login__main-body">
        <form class="pf-c-form" onsubmit="return false">
          <div class="pf-c-form__group">
            <label class="pf-c-form__label" for="uid">
              <span class="pf-c-form__label-text">Email or Username</span><span class="pf-c-form__label-required">*</span>
            </label>
            <input class="pf-c-form-control" id="uid" type="text" placeholder="Email or Username">
          </div>
          <div class="pf-c-form__group pf-m-action">
            <button class="pf-c-button pf-m-primary pf-m-block" type="submit">Log in</button>
          </div>
        </form>
      </div>
      <footer class="pf-c-login__main-footer">
        <div class="pf-c-login__main-footer-band">
          <p class="pf-c-login__main-footer-band-item">Need an account? <a id="enroll" href="/if/flow/ew-self-enrol/">Sign up.</a></p>
          <p class="pf-c-login__main-footer-band-item"><a href="/if/flow/default-recovery-flow/">Forgot username or password?</a></p>
        </div>
      </footer>
    </div>

    <!-- Sign up: the self-enrolment flow -->
    <div class="pf-c-login__main page" data-page="signup" hidden>
      <div class="pf-c-login__main-header pf-c-brand ak-brand"><img src="https://cloud.electronworkshop.com.au/s/5bW7TXe2JH4KgBE/download" alt="TalkingSites"></div>
      <header class="pf-c-login__main-header">
        <h1 class="pf-c-title pf-m-3xl">Create your account</h1>
      </header>
      <div class="pf-c-login__main-body">
        <form class="pf-c-form" onsubmit="return false">
          <div class="pf-c-form__group">
            <label class="pf-c-form__label" for="name"><span class="pf-c-form__label-text">Name</span><span class="pf-c-form__label-required">*</span></label>
            <input class="pf-c-form-control" id="name" type="text" placeholder="Your name">
          </div>
          <div class="pf-c-form__group">
            <label class="pf-c-form__label" for="email"><span class="pf-c-form__label-text">Email</span><span class="pf-c-form__label-required">*</span></label>
            <input class="pf-c-form-control" id="email" type="email" placeholder="you@example.org">
          </div>
          <div class="pf-c-form__group">
            <label class="pf-c-form__label" for="pw"><span class="pf-c-form__label-text">Password</span><span class="pf-c-form__label-required">*</span></label>
            <input class="pf-c-form-control" id="pw" type="password" placeholder="Password">
          </div>
          <div class="pf-c-form__group pf-m-action">
            <button class="pf-c-button pf-m-primary pf-m-block" type="submit">Continue</button>
          </div>
        </form>
      </div>
    </div>

    <footer class="pf-c-login__footer">
      <ul class="pf-c-list pf-m-inline"><li><a href="#">Powered by authentik</a></li></ul>
    </footer>
  </div>
</div>

<nav class="switcher" aria-label="Preview">
  <button type="button" data-variant="light" aria-pressed="false">Light</button>
  <button type="button" data-variant="glass" aria-pressed="true">Glass</button>
  <button type="button" data-variant="gradient" aria-pressed="false">Gradient</button>
  <span class="sep" aria-hidden="true"></span>
  <label class="logo-pick">Logo
    <select id="logo-select">
      <option value="glow">Glow</option>
      <option value="white">White</option>
      <option value="bright">Bright</option>
      <option value="sticker">Sticker</option>
      <option value="spotlight">Spotlight</option>
      <option value="band" selected>Band</option>
      <option value="underline">Underline</option>
      <option value="wordmark">Wordmark (no LABS)</option>
      <option value="original">Original</option>
    </select>
  </label>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-page="signin" aria-pressed="true">Sign in</button>
  <button type="button" data-page="signup" aria-pressed="false">Sign up</button>
</nav>
<script>
  function pick(attr, value) {
    document.querySelectorAll('.switcher [data-' + attr + ']').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset[attr] === value));
    });
  }
  document.querySelectorAll('.switcher [data-variant]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.getElementById('variant').href = 'variants/' + b.dataset.variant + '.css';
      pick('variant', b.dataset.variant);
    });
  });
  document.getElementById('logo-select').addEventListener('change', function (e) {
    document.getElementById('logo').href = 'logo/' + e.target.value + '.css';
  });
  document.querySelectorAll('.switcher [data-page]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.page').forEach(function (p) { p.hidden = p.dataset.page !== b.dataset.page; });
      pick('page', b.dataset.page);
    });
  });
</script>
</body>
</html>
